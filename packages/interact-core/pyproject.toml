[project]
name = "interact-core"
version = "0.39.0"
description = "Provider-independent wire contracts for Interact clients and services"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.13.1,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interact_core"]

[tool.hatch.build.targets.wheel.force-include]
"schema/prompt-contracts.schema.json" = "interact_core/schema/prompt-contracts.schema.json"
